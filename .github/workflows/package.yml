name: package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"
  NODE_VERSION: "22.22.3"
  WAILS_VERSION: "v2.12.0"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - run: choco install nsis --no-progress --yes
      - shell: pwsh
        run: |
          "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          & "C:\Program Files (x86)\NSIS\makensis.exe" /VERSION
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - id: version
        shell: pwsh
        run: |
          $value = (Get-Content VERSION -Raw).Trim()
          "value=$value" >> $env:GITHUB_OUTPUT
      - shell: pwsh
        run: .\scripts\package.ps1 -Wails "$(go env GOPATH)\bin\wails.exe" -OutputDirectory "$env:RUNNER_TEMP\aav-package"
      - shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          .\scripts\test-windows-installer.ps1 `
            -Installer "$env:RUNNER_TEMP\aav-package\agent-action-visualizer-v$version-windows-amd64-installer.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-action-visualizer-v${{ steps.version.outputs.value }}-windows-amd64
          path: ${{ runner.temp }}/aav-package
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - id: version
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - working-directory: apps/desktop
        run: |
          version="$(tr -d '\r\n' < ../../VERSION)"
          commit="${GITHUB_SHA:0:12}"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          "$(go env GOPATH)/bin/wails" build -clean -platform linux/amd64 -tags webkit2_41 -trimpath \
            -ldflags "-X github.com/greadee/agent-action-visualizer/internal/buildinfo.Version=${version} -X github.com/greadee/agent-action-visualizer/internal/buildinfo.Commit=${commit} -X github.com/greadee/agent-action-visualizer/internal/buildinfo.BuildDate=${SOURCE_DATE_EPOCH}" \
            -o "agent-action-visualizer-v${version}-linux-amd64"
          cd build/bin
          sha256sum "agent-action-visualizer-v${version}-linux-amd64" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-action-visualizer-v${{ steps.version.outputs.value }}-linux-amd64
          path: apps/desktop/build/bin
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - id: version
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - working-directory: apps/desktop
        run: |
          version="$(tr -d '\r\n' < ../../VERSION)"
          commit="${GITHUB_SHA:0:12}"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          "$(go env GOPATH)/bin/wails" build -clean -platform darwin/universal -trimpath \
            -ldflags "-X github.com/greadee/agent-action-visualizer/internal/buildinfo.Version=${version} -X github.com/greadee/agent-action-visualizer/internal/buildinfo.Commit=${commit} -X github.com/greadee/agent-action-visualizer/internal/buildinfo.BuildDate=${SOURCE_DATE_EPOCH}" \
            -o "agent-action-visualizer-v${version}-macos-universal"
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent "AgentActionVisualizer.app" "agent-action-visualizer-v${version}-macos-universal.zip"
          shasum -a 256 "agent-action-visualizer-v${version}-macos-universal.zip" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-action-visualizer-v${{ steps.version.outputs.value }}-macos-universal
          path: apps/desktop/build/bin
          if-no-files-found: error
          retention-days: 14
