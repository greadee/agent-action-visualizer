name: ci

on:
  push:
    branches: [main, codex/initial-build]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            go.sum
            apps/desktop/go.sum
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --json | node scripts/check-npm-audit.mjs high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-frontend-dist
          path: apps/desktop/frontend/dist
          retention-days: 1

  desktop:
    needs: [go, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: apps/desktop/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: desktop-frontend-dist
          path: apps/desktop/frontend/dist
      - working-directory: apps/desktop
        run: go mod verify
      - working-directory: apps/desktop
        run: go test .
      - working-directory: apps/desktop
        run: go vet .
