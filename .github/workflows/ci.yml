name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: |
            go.sum
            apps/desktop/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - name: Validate root Go module
        run: |
          go mod verify
          go test ./...
          go vet ./...
      - name: Validate frontend
        working-directory: apps/desktop/frontend
        run: |
          npm ci
          npm audit --json | node scripts/check-npm-audit.mjs high
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - working-directory: apps/desktop
        name: Validate desktop Go module
        run: |
          go mod verify
          go test .
          go vet .
